name: Build Specific Passwall Version

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Passwall版本标签 (例如: 4.72-1, 4.71-1)'
        required: true
        default: '4.72-1'
      architectures:
        description: '要编译的架构'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - x86_64
          - aarch64_cortex-a53
      include_luci:
        description: '是否包含Luci界面'
        required: true
        type: boolean
        default: true

jobs:
  build-x86_64:
    if: ${{ github.event.inputs.architectures == 'all' || github.event.inputs.architectures == 'x86_64' }}
    runs-on: ubuntu-22.04
    name: Build x86_64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Validate version tag
        run: |
          echo "Building version: ${{ github.event.inputs.version_tag }}"
          echo "Architecture: x86_64"
          echo "Include Luci: ${{ github.event.inputs.include_luci }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Clone makeself repository
        run: |
          git clone https://github.com/megastep/makeself.git
          cd makeself
          chmod +x makeself.sh

      - name: Download specific version files
        run: |
          mkdir -p downloads
          cd downloads
          
          echo "Fetching release info for tag: ${{ github.event.inputs.version_tag }}"
          
          # 获取指定版本的发布信息
          for i in {1..3}; do
            release_info=$(curl -s -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/tags/${{ github.event.inputs.version_tag }}" || echo "CURL_FAILED")
            
            if [ "$release_info" != "CURL_FAILED" ] && [ -n "$release_info" ] && [ "$release_info" != "null" ]; then
              echo "Successfully fetched release info (attempt $i)"
              echo "$release_info" > release_info.json
              break
            else
              echo "Failed to fetch release info (attempt $i)"
              sleep 2
            fi
          done
          
          if [ ! -f release_info.json ]; then
            echo "错误: 无法获取版本 ${{ github.event.inputs.version_tag }} 的信息"
            exit 1
          fi
          
          release_info=$(cat release_info.json)
          if echo "$release_info" | grep -q "Not Found"; then
            echo "错误: 未找到版本 ${{ github.event.inputs.version_tag }}"
            exit 1
          fi
          
          # 下载x86_64架构文件
          echo "Looking for x86_64 files..."
          zip_url=$(echo "$release_info" | jq -r '.assets[] | select(.name | contains("x86_64")) | .browser_download_url' | head -1)
          
          if [ -z "$zip_url" ] || [ "$zip_url" = "null" ]; then
            zip_url=$(echo "$release_info" | jq -r '.assets[] | select(.name | test("passwall.*x86.*64.*zip"; "i")) | .browser_download_url' | head -1)
          fi
          
          if [ -z "$zip_url" ] || [ "$zip_url" = "null" ]; then
            echo "错误: 未找到x86_64架构的文件"
            exit 1
          fi
          
          echo "下载x86_64文件: $zip_url"
          curl -L -o "passwall_packages_ipk_x86_64.zip" "$zip_url"
          
          # 下载luci文件
          if [ "${{ github.event.inputs.include_luci }}" = "true" ]; then
            echo "Looking for Luci files..."
            luci_urls=$(echo "$release_info" | jq -r '.assets[] | select(.name | contains("luci")) | .browser_download_url' || true)
            
            if [ -n "$luci_urls" ]; then
              for url in $luci_urls; do
                if [ "$url" != "null" ] && [ -n "$url" ]; then
                  echo "下载Luci文件: $url"
                  curl -L -o "$(basename "$url")" "$url" || echo "警告: 下载失败: $url"
                fi
              done
            fi
          fi

      - name: Organize files
        run: |
          mkdir -p passwall_x86_64/depends passwall_x86_64/main
          
          if [ -f downloads/passwall_packages_ipk_x86_64.zip ]; then
            unzip -q downloads/passwall_packages_ipk_x86_64.zip -d passwall_x86_64/depends
            rm downloads/passwall_packages_ipk_x86_64.zip
          else
            echo "错误: passwall_packages_ipk_x86_64.zip 文件不存在"
            exit 1
          fi
          
          if [ "${{ github.event.inputs.include_luci }}" = "true" ]; then
            if ls downloads/luci-*.ipk 1>/dev/null 2>&1; then
              cp downloads/luci-*.ipk passwall_x86_64/main/ || true
            fi
          fi

      - name: Create install.sh script
        run: |
          cat <<'EOF' > passwall_x86_64/install.sh
          #!/bin/sh
          echo "========================================"
          echo "Passwall Installation Script"
          echo "Version: ${{ github.event.inputs.version_tag }}"
          echo "Architecture: x86_64"
          echo "Include Luci: ${{ github.event.inputs.include_luci }}"
          echo "========================================"
          
          if [ ! -f /etc/openwrt_release ]; then
            echo "错误: 这不是OpenWrt系统!"
            exit 1
          fi
          
          echo "更新软件包列表..."
          opkg update
          
          if [ $? -ne 0 ]; then
              echo "警告: 更新软件包列表失败，尝试继续安装..."
          fi
          
          echo "安装依赖包..."
          opkg install depends/*.ipk
          
          if [ -d "main" ] && [ "$(ls -A main/*.ipk 2>/dev/null)" ]; then
              echo "安装主程序包..."
              opkg install main/*.ipk
          fi
          
          echo "========================================"
          echo "安装完成!"
          echo "请重启Luci界面或执行: /etc/init.d/rpcd restart"
          echo "========================================"
          EOF
          
          chmod +x passwall_x86_64/install.sh

      - name: Create self-extracting package
        run: |
          ./makeself/makeself.sh \
            passwall_x86_64/ \
            passwall_x86_64_${{ github.event.inputs.version_tag }}_luci_${{ github.event.inputs.include_luci }}.run \
            "Passwall x86_64 ${{ github.event.inputs.version_tag }}" \
            ./install.sh
          
          echo "创建的文件:"
          ls -lh passwall_*.run

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: passwall-x86_64-${{ github.event.inputs.version_tag }}
          path: passwall_x86_64_${{ github.event.inputs.version_tag }}_luci_${{ github.event.inputs.include_luci }}.run
          retention-days: 30

  build-aarch64:
    if: ${{ github.event.inputs.architectures == 'all' || github.event.inputs.architectures == 'aarch64_cortex-a53' }}
    runs-on: ubuntu-22.04
    name: Build aarch64_cortex-a53
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Validate version tag
        run: |
          echo "Building version: ${{ github.event.inputs.version_tag }}"
          echo "Architecture: aarch64_cortex-a53"
          echo "Include Luci: ${{ github.event.inputs.include_luci }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Clone makeself repository
        run: |
          git clone https://github.com/megastep/makeself.git
          cd makeself
          chmod +x makeself.sh

      - name: Download specific version files
        run: |
          mkdir -p downloads
          cd downloads
          
          echo "Fetching release info for tag: ${{ github.event.inputs.version_tag }}"
          
          for i in {1..3}; do
            release_info=$(curl -s -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/tags/${{ github.event.inputs.version_tag }}" || echo "CURL_FAILED")
            
            if [ "$release_info" != "CURL_FAILED" ] && [ -n "$release_info" ] && [ "$release_info" != "null" ]; then
              echo "Successfully fetched release info (attempt $i)"
              echo "$release_info" > release_info.json
              break
            else
              echo "Failed to fetch release info (attempt $i)"
              sleep 2
            fi
          done
          
          if [ ! -f release_info.json ]; then
            echo "错误: 无法获取版本 ${{ github.event.inputs.version_tag }} 的信息"
            exit 1
          fi
          
          release_info=$(cat release_info.json)
          if echo "$release_info" | grep -q "Not Found"; then
            echo "错误: 未找到版本 ${{ github.event.inputs.version_tag }}"
            exit 1
          fi
          
          echo "Looking for aarch64 files..."
          zip_url=$(echo "$release_info" | jq -r '.assets[] | select(.name | contains("aarch64")) | .browser_download_url' | head -1)
          
          if [ -z "$zip_url" ] || [ "$zip_url" = "null" ]; then
            zip_url=$(echo "$release_info" | jq -r '.assets[] | select(.name | test("passwall.*aarch64.*cortex.*a53.*zip"; "i")) | .browser_download_url' | head -1)
          fi
          
          if [ -z "$zip_url" ] || [ "$zip_url" = "null" ]; then
            zip_url=$(echo "$release_info" | jq -r '.assets[] | select(.name | test("passwall.*arm.*64.*zip"; "i")) | .browser_download_url' | head -1)
          fi
          
          if [ -z "$zip_url" ] || [ "$zip_url" = "null" ]; then
            echo "错误: 未找到aarch64_cortex-a53架构的文件"
            exit 1
          fi
          
          echo "下载aarch64文件: $zip_url"
          curl -L -o "passwall_packages_ipk_aarch64_cortex-a53.zip" "$zip_url"
          
          if [ "${{ github.event.inputs.include_luci }}" = "true" ]; then
            echo "Looking for Luci files..."
            luci_urls=$(echo "$release_info" | jq -r '.assets[] | select(.name | contains("luci")) | .browser_download_url' || true)
            
            if [ -n "$luci_urls" ]; then
              for url in $luci_urls; do
                if [ "$url" != "null" ] && [ -n "$url" ]; then
                  echo "下载Luci文件: $url"
                  curl -L -o "$(basename "$url")" "$url" || echo "警告: 下载失败: $url"
                fi
              done
            fi
          fi

      - name: Organize files
        run: |
          mkdir -p passwall_aarch64/depends passwall_aarch64/main
          
          if [ -f downloads/passwall_packages_ipk_aarch64_cortex-a53.zip ]; then
            unzip -q downloads/passwall_packages_ipk_aarch64_cortex-a53.zip -d passwall_aarch64/depends
            rm downloads/passwall_packages_ipk_aarch64_cortex-a53.zip
          else
            echo "错误: passwall_packages_ipk_aarch64_cortex-a53.zip 文件不存在"
            exit 1
          fi
          
          if [ "${{ github.event.inputs.include_luci }}" = "true" ]; then
            if ls downloads/luci-*.ipk 1>/dev/null 2>&1; then
              cp downloads/luci-*.ipk passwall_aarch64/main/ || true
            fi
          fi

      - name: Create install.sh script
        run: |
          cat <<'EOF' > passwall_aarch64/install.sh
          #!/bin/sh
          echo "========================================"
          echo "Passwall Installation Script"
          echo "Version: ${{ github.event.inputs.version_tag }}"
          echo "Architecture: aarch64_cortex-a53"
          echo "Include Luci: ${{ github.event.inputs.include_luci }}"
          echo "========================================"
          
          if [ ! -f /etc/openwrt_release ]; then
            echo "错误: 这不是OpenWrt系统!"
            exit 1
          fi
          
          echo "更新软件包列表..."
          opkg update
          
          if [ $? -ne 0 ]; then
              echo "警告: 更新软件包列表失败，尝试继续安装..."
          fi
          
          echo "安装依赖包..."
          opkg install depends/*.ipk
          
          if [ -d "main" ] && [ "$(ls -A main/*.ipk 2>/dev/null)" ]; then
              echo "安装主程序包..."
              opkg install main/*.ipk
          fi
          
          echo "========================================"
          echo "安装完成!"
          echo "请重启Luci界面或执行: /etc/init.d/rpcd restart"
          echo "========================================"
          EOF
          
          chmod +x passwall_aarch64/install.sh

      - name: Create self-extracting package
        run: |
          ./makeself/makeself.sh \
            passwall_aarch64/ \
            passwall_aarch64_${{ github.event.inputs.version_tag }}_luci_${{ github.event.inputs.include_luci }}.run \
            "Passwall aarch64_cortex-a53 ${{ github.event.inputs.version_tag }}" \
            ./install.sh
          
          echo "创建的文件:"
          ls -lh passwall_*.run

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: passwall-aarch64-${{ github.event.inputs.version_tag }}
          path: passwall_aarch64_${{ github.event.inputs.version_tag }}_luci_${{ github.event.inputs.include_luci }}.run
          retention-days: 30

  create-release:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-22.04
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Move artifacts to root
        run: |
          echo "移动文件到根目录..."
          # 查找所有.run文件并移动到当前目录
          find artifacts -name "*.run" -type f -exec mv {} . \;
          echo "当前目录的文件:"
          ls -la *.run 2>/dev/null || echo "没有找到.run文件"
      
      - name: Prepare release notes
        run: |
          # 获取release信息
          release_info=$(curl -s -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/tags/${{ github.event.inputs.version_tag }}" || echo "{}")
          
          release_notes=$(echo "$release_info" | jq -r '.body // "No release notes available."' 2>/dev/null || echo "无法获取版本说明")
          
          # 构建release body
          cat <<EOF > release_body.md
          # Passwall Run Files - ${{ github.event.inputs.version_tag }}
          
          ## 版本信息
          - **版本**: ${{ github.event.inputs.version_tag }}
          - **编译时间**: $(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M')
          - **包含Luci**: ${{ github.event.inputs.include_luci }}
          - **请求的架构**: ${{ github.event.inputs.architectures }}
          
          ## 下载文件
          EOF
          
          # 添加文件列表
          for file in *.run; do
            if [ -f "$file" ]; then
              filesize=$(du -h "$file" | cut -f1)
              echo "- **$file** ($filesize)" >> release_body.md
            fi
          done
          
          cat <<EOF >> release_body.md
          
          ## 使用说明
          1. 上传.run文件到OpenWrt设备
          2. 添加执行权限：\`chmod +x passwall_*.run\`
          3. 运行安装：\`./passwall_*.run\`
          4. 重启Luci界面或执行：\`/etc/init.d/rpcd restart\`
          
          ## 原始版本说明
          $release_notes
          
          ---
          *Build by GitHub Actions | 支持博客：[wkdaily.cpolar.top](https://wkdaily.cpolar.top/archives/1)*
          EOF
          
          echo "Release notes:"
          cat release_body.md
      
      - name: Generate timestamp
        id: timestamp
        run: |
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        if: hashFiles('*.run') != ''
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.event.inputs.version_tag }}-${{ steps.timestamp.outputs.TIMESTAMP }}
          name: "Passwall ${{ github.event.inputs.version_tag }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            *.run
      
      - name: Notify if no files
        if: hashFiles('*.run') == ''
        run: |
          echo "错误: 没有找到任何.run文件"
          echo "可能的原因:"
          echo "1. 版本号 '${{ github.event.inputs.version_tag }}' 不存在"
          echo "2. 下载的文件格式不正确"
          echo "3. 构建过程失败"
          exit 1
