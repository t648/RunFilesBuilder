name: Build Specific Passwall Version

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Passwall版本标签 (例如: 4.72-1, 4.71-1)'
        required: true
        default: '4.72-1'
      architectures:
        description: '要编译的架构'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - x86_64
          - aarch64_cortex-a53
      include_luci:
        description: '是否包含Luci界面'
        required: true
        type: boolean
        default: true

env:
  BUILD_ARCHS: "x86_64 aarch64_cortex-a53"

jobs:
  build:
    runs-on: ubuntu-22.04
    
    strategy:
      matrix:
        arch: 
          - ${{ fromJSON('["x86_64", "aarch64_cortex-a53"]') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Validate version tag
        run: |
          echo "Building version: ${{ github.event.inputs.version_tag }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Include Luci: ${{ github.event.inputs.include_luci }}"
          
          # 验证tag格式（可选）
          if [[ ! "${{ github.event.inputs.version_tag }}" =~ ^[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Warning: Tag format might be incorrect. Expected format: X.XX-X"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Clone makeself repository
        run: |
          git clone https://github.com/megastep/makeself.git
          cd makeself
          chmod +x makeself.sh

      - name: Download specific version files
        run: |
          mkdir -p downloads
          cd downloads
          
          # 获取指定版本的发布信息
          release_info=$(curl -s "https://api.github.com/repos/xiaorouji/openwrt-passwall/releases/tags/${{ github.event.inputs.version_tag }}")
          
          if [ "$release_info" = "Not Found" ] || [ -z "$release_info" ]; then
            echo "错误: 未找到版本 ${{ github.event.inputs.version_tag }}"
            exit 1
          fi
          
          # 根据架构下载对应的zip文件
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            zip_url=$(echo "$release_info" | jq -r '.assets[] | select(.name | contains("passwall_packages_ipk_x86_64")) | .browser_download_url')
            if [ -z "$zip_url" ]; then
              echo "未找到x86_64架构的文件"
              exit 1
            fi
            echo "下载x86_64文件: $zip_url"
            curl -L -o "passwall_packages_ipk_x86_64.zip" "$zip_url"
          else
            zip_url=$(echo "$release_info" | jq -r '.assets[] | select(.name | contains("passwall_packages_ipk_aarch64_cortex-a53")) | .browser_download_url')
            if [ -z "$zip_url" ]; then
              echo "未找到aarch64_cortex-a53架构的文件"
              exit 1
            fi
            echo "下载aarch64_cortex-a53文件: $zip_url"
            curl -L -o "passwall_packages_ipk_aarch64_cortex-a53.zip" "$zip_url"
          fi
          
          # 下载luci文件（如果需要）
          if [ "${{ github.event.inputs.include_luci }}" = "true" ]; then
            luci_urls=$(echo "$release_info" | jq -r '.assets[] | select(.name | match("luci.*19\\.07.*ipk$")) | .browser_download_url')
            for url in $luci_urls; do
              echo "下载Luci文件: $url"
              curl -L -o "$(basename "$url")" "$url"
            done
          fi

      - name: Organize files
        run: |
          mkdir -p passwall_${{ matrix.arch }}/depends passwall_${{ matrix.arch }}/main
          
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            unzip downloads/passwall_packages_ipk_x86_64.zip -d passwall_${{ matrix.arch }}/depends
            rm downloads/passwall_packages_ipk_x86_64.zip
          else
            unzip downloads/passwall_packages_ipk_aarch64_cortex-a53.zip -d passwall_${{ matrix.arch }}/depends
            rm downloads/passwall_packages_ipk_aarch64_cortex-a53.zip
          fi
          
          if [ "${{ github.event.inputs.include_luci }}" = "true" ]; then
            find downloads -name "luci-19.07*.ipk" -exec cp {} passwall_${{ matrix.arch }}/main/ \;
          else
            echo "跳过Luci文件"
          fi

      - name: Create install.sh script
        run: |
          cat <<'EOF' > passwall_${{ matrix.arch }}/install.sh
          #!/bin/sh
          echo "========================================"
          echo "Passwall Installation Script"
          echo "Version: ${{ github.event.inputs.version_tag }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Include Luci: ${{ github.event.inputs.include_luci }}"
          echo "========================================"
          
          # 检查是否为OpenWrt系统
          if [ ! -f /etc/openwrt_release ]; then
            echo "错误: 这不是OpenWrt系统!"
            exit 1
          fi
          
          echo "Updating package list..."
          opkg update
          
          if [ $? -ne 0 ]; then
              echo "警告: 更新软件包列表失败，尝试继续安装..."
          fi
          
          echo "Installing dependencies..."
          opkg install depends/*.ipk
          
          if [ -d "main" ] && [ "$(ls -A main/*.ipk 2>/dev/null)" ]; then
              echo "Installing main packages..."
              opkg install main/*.ipk
          fi
          
          echo "========================================"
          echo "安装完成!"
          echo "请重启Luci界面或执行: /etc/init.d/rpcd restart"
          echo "========================================"
          EOF
          
          chmod +x passwall_${{ matrix.arch }}/install.sh

      - name: Create self-extracting package
        run: |
          ./makeself/makeself.sh \
            passwall_${{ matrix.arch }}/ \
            passwall_${{ matrix.arch }}_${{ github.event.inputs.version_tag }}_luci_${{ github.event.inputs.include_luci }}.run \
            "Passwall ${{ matrix.arch }} ${{ github.event.inputs.version_tag }}" \
            ./install.sh
          
          echo "Created file:"
          ls -lh passwall_*.run

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passwall-${{ github.event.inputs.version_tag }}-${{ matrix.arch }}
          path: |
            passwall_${{ matrix.arch }}_${{ github.event.inputs.version_tag }}_luci_${{ github.event.inputs.include_luci }}.run
          retention-days: 30

    outputs:
      version_tag: ${{ github.event.inputs.version_tag }}
      include_luci: ${{ github.event.inputs.include_luci }}

  create-release:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: passwall-*
          path: artifacts/
          merge-multiple: true
      
      - name: List downloaded files
        run: find artifacts -type f -name "*.run" | xargs -I {} echo "Found: {}"
      
      - name: Prepare release notes
        run: |
          # 从指定版本获取release notes
          release_info=$(curl -s "https://api.github.com/repos/xiaorouji/openwrt-passwall/releases/tags/${{ needs.build.outputs.version_tag }}")
          release_notes=$(echo "$release_info" | jq -r '.body // "No release notes available."')
          
          # 构建release body
          cat <<EOF > release_body.md
          # Passwall Run Files - ${{ needs.build.outputs.version_tag }}
          
          ## 版本信息
          - **版本**: ${{ needs.build.outputs.version_tag }}
          - **编译时间**: $(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M')
          - **包含Luci**: ${{ needs.build.outputs.include_luci }}
          
          ## 下载文件
          此版本包含以下架构的安装包：
          - **x86_64** 架构
          - **aarch64_cortex-a53** 架构
          
          ## 使用说明
          1. 上传.run文件到OpenWrt设备
          2. 添加执行权限：\`chmod +x passwall_*.run\`
          3. 运行安装：\`./passwall_*.run\`
          4. 重启Luci界面或执行：\`/etc/init.d/rpcd restart\`
          
          ## 原始版本说明
          $release_notes
          
          ---
          *Build by GitHub Actions | 支持博客：[wkdaily.cpolar.top](https://wkdaily.cpolar.top/archives/1)*
          EOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ needs.build.outputs.version_tag }}-$(date +%Y%m%d%H%M%S)
          name: "Passwall ${{ needs.build.outputs.version_tag }}"
          body_file: release_body.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.run
